[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -ra --strict-markers
markers =
    integration: testes que montam o bot real (discord.ext.commands) com planilha/Discord falsos
    property: testes baseados em propriedades (hypothesis)
    performance: testes de desempenho com limite de tempo
    static: verificações estáticas do código-fonte
